name: Catalog check

on:
  push:
    paths:
      - "teardowns/**"
      - "scripts/build_catalog.py"
      - "README.md"
      - "README.zh-CN.md"
  pull_request:
    paths:
      - "teardowns/**"
      - "scripts/build_catalog.py"
      - "README.md"
      - "README.zh-CN.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated catalog is up to date
        run: python3 scripts/build_catalog.py --check
